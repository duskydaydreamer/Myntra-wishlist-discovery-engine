name: Weekly Pipeline Refresh

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pipeline Orchestrator
        run: |
          curl -X POST "${{ secrets.RAILWAY_BACKEND_URL }}/api/internal/pipeline/refresh" \
               -H "Authorization: Bearer ${{ secrets.SCHEDULER_SECRET }}" \
               -H "Content-Type: application/json" \
               -d '{}' \
               --fail --show-error --silent
